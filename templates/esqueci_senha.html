<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - Sistema de Benefícios Eventuais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg border-0 rounded-4" style="width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='img/logo_prefeitura.png') }}"
                     alt="Prefeitura de Ji-Paraná"
                     style="height:70px;width:auto;margin-bottom:12px;">
                <h5 style="color:#1b2f5e;font-weight:700;margin-bottom:2px;">Esqueci minha senha</h5>
                <p class="text-muted small mb-0">Informe seu usuário para receber o link de redefinição</p>
            </div>

            {% if erro %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle"></i> {{ erro }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}

            {% if sucesso %}
            <div class="alert alert-success text-center" role="alert">
                <i class="fas fa-envelope-circle-check fa-2x mb-2"></i>
                <p class="mb-0">{{ sucesso }}</p>
            </div>
            {% else %}
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label class="form-label">
                        <i class="fas fa-user"></i> Usuário
                    </label>
                    <input
                        type="text"
                        name="usuario"
                        class="form-control"
                        placeholder="Digite seu usuário"
                        required
                        autofocus>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fas fa-paper-plane"></i> Enviar link de redefinição
                </button>
            </form>
            {% endif %}

            <hr class="my-4">
            <div class="text-center">
                <a href="{{ url_for('login') }}" class="text-decoration-none small">
                    <i class="fas fa-arrow-left"></i> Voltar para o login
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
