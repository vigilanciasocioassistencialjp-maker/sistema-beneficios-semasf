<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Sistema de Benefícios Eventuais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .password-requirements {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
        .password-requirements i {
            margin-right: 5px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x text-primary"></i>
                        <h3 class="mt-2">Redefinir Senha</h3>
                        <p class="text-muted">Defina uma nova senha para sua conta</p>
                    </div>

                    {% if erro %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle"></i> {{ erro }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}

                    {% if sucesso %}
                    <div class="alert alert-success text-center" role="alert">
                        <i class="fas fa-check-circle fa-2x mb-2"></i>
                        <h5>{{ sucesso }}</h5>
                    </div>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Ir para o login
                        </a>
                    </div>
                    {% elif token_valido %}
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Nova Senha
                            </label>
                            <div class="input-group">
                                <input type="password" name="nova_senha" class="form-control" id="nova_senha" required>
                                <button type="button" class="btn btn-outline-secondary btn-ver-senha" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-requirements">
                                <i class="fas fa-info-circle"></i> Mínimo de 6 caracteres, 1 maiúscula e 1 número
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="fas fa-check-circle"></i> Confirmar Nova Senha
                            </label>
                            <div class="input-group">
                                <input type="password" name="confirmar_senha" class="form-control" id="confirmar_senha" required>
                                <button type="button" class="btn btn-outline-secondary btn-ver-senha" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="fas fa-save"></i> Redefinir Senha
                        </button>
                    </form>
                    {% else %}
                    <div class="text-center mt-3">
                        <a href="{{ url_for('esqueci_senha') }}" class="btn btn-primary">
                            <i class="fas fa-redo"></i> Solicitar novo link
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.btn-ver-senha').forEach(btn => {
        btn.addEventListener('click', function() {
            const input = this.previousElementSibling;
            const icon  = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });
    });

    document.getElementById('confirmar_senha')?.addEventListener('input', function() {
        const novaSenha = document.getElementById('nova_senha').value;
        const confirmar = this.value;

        if (novaSenha !== confirmar) {
            this.setCustomValidity('As senhas não coincidem');
        } else {
            this.setCustomValidity('');
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
